# Solo MySQL 8.0 para desarrollo. La app Django corre localmente en un venv.
services:
  db:
    image: mysql:8.0
    container_name: dl_casos_mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: "${DB_NAME:-dl_casos}"
      MYSQL_USER: "${DB_USER:-dl_casos}"
      MYSQL_PASSWORD: "${DB_PASSWORD:-cambiar}"
      MYSQL_ROOT_PASSWORD: "${DB_ROOT_PASSWORD:-cambiar_root}"
    command:
      - "--default-authentication-plugin=mysql_native_password"
      - "--character-set-server=utf8mb4"
      - "--collation-server=utf8mb4_unicode_ci"
    ports:
      - "${DB_PORT:-3306}:3306"
    volumes:
      - dl_casos_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${DB_ROOT_PASSWORD:-cambiar_root}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  dl_casos_mysql_data:
